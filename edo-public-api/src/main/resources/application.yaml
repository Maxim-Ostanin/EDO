spring:
  datasource:
        url: jdbc:postgresql://localhost:5432/edo
        username: a1111
        password: ""


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    edo_public.api: DEBUG
  file:
    path: logs/
  pattern:
    file: "%d(yyyy-MM-dd HH:mm:ss): [%level] %logger{36} - %msg%n"